name: Private provider dispatch validation
on:
  push:
    branches: [bbednarski/private-provider-dispatch-ci]
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - id: versions
        uses: ./.github/actions/load-ci-tool-versions
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
        with:
          toolchain: ${{ steps.versions.outputs.rust_version }}
          components: rustfmt,clippy
          cache: false
      - uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57
        with:
          version: ${{ steps.versions.outputs.uv_version }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - uses: taiki-e/install-action@c070f87102a1c75b3183910f391c1cb887fe13c8
        with:
          tool: cargo-nextest@${{ steps.versions.outputs.cargo_nextest_version }},just@${{ steps.versions.outputs.just_version }}
      - name: Native plugin and gateway regression suite
        run: |
          just build-test-plugin-fixtures
          cargo nextest run --locked -p nemo-relay-cli -p nemo-relay -p nemo-relay-plugin -E 'test(private_provider) | test(provider_dispatch) | test(provider_capability) | test(provider_request) | test(caller_credential_target) | test(native_abi) | binary(native_plugin_tests)' --profile ci --no-fail-fast
      - name: Canonical Rust suite
        if: ${{ !cancelled() }}
        run: just test-rust
